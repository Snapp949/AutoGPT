name: Automation Dashboard

on:
  workflow_dispatch:
  schedule:
    # Run on the first day of each month at 7 AM UTC
    - cron: '0 7 1 * *'

permissions:
  contents: read
  issues: write

jobs:
  generate-dashboard:
    name: Generate Automation Dashboard
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate comprehensive dashboard
        run: |
          cat << 'EOF' > automation-dashboard.md
          # 🤖 Automation Dashboard
          
          ## Overview
          
          This repository is equipped with comprehensive automation capabilities for continuous improvement.
          
          ## 🛠️ Active Workflows
          
          ### Security & Issue Detection
          
          | Workflow | Status | Schedule | Purpose |
          |----------|--------|----------|---------|
          | CodeQL | [![CodeQL](https://github.com/${{ github.repository }}/actions/workflows/codeql.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/codeql.yml) | Push, PR, Weekly | Security vulnerability scanning |
          | Issue Detection | [![Issue Detection](https://github.com/${{ github.repository }}/actions/workflows/automated-issue-detection.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/automated-issue-detection.yml) | Push, PR, Daily (3 AM) | Code quality analysis |
          
          ### Performance Optimization
          
          | Workflow | Status | Schedule | Purpose |
          |----------|--------|----------|---------|
          | Performance Monitoring | [![Performance](https://github.com/${{ github.repository }}/actions/workflows/performance-monitoring.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/performance-monitoring.yml) | Push, PR, Daily (2 AM) | Performance profiling |
          | Bottleneck Detection | [![Bottleneck](https://github.com/${{ github.repository }}/actions/workflows/bottleneck-detection.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/bottleneck-detection.yml) | Weekly (Sun 4 AM) | Complexity & bottleneck analysis |
          
          ### Automated Improvements
          
          | Workflow | Status | Schedule | Purpose |
          |----------|--------|----------|---------|
          | Auto-Optimization | [![Auto-Optimization](https://github.com/${{ github.repository }}/actions/workflows/auto-optimization.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/auto-optimization.yml) | Weekly (Mon 5 AM) | Automated code fixes |
          | Monitoring Agent | [![Monitoring](https://github.com/${{ github.repository }}/actions/workflows/monitoring-agent.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/monitoring-agent.yml) | Daily (6 AM) | Health & trend monitoring |
          
          ## 📊 Capabilities Summary
          
          ### 1. Issue Detection ✅
          - **Static Analysis**: Pylint, ESLint, Flake8, Ruff
          - **Security Scanning**: CodeQL, Trivy, Dependency Review
          - **Secret Detection**: Pre-commit hooks
          - **Output**: Detailed reports in workflow artifacts
          
          ### 2. Performance Profiling ⚡
          - **Python**: py-spy, memory-profiler
          - **Frontend**: Bundle analysis, dependency monitoring
          - **Complexity**: Radon cyclomatic complexity
          - **Output**: Performance profiles and metrics
          
          ### 3. Automated Fixes 🔧
          - **Python**: autoflake, autopep8, isort, black
          - **Frontend**: ESLint --fix, Prettier
          - **Integration**: Automatic PR creation
          - **Output**: Fix summaries and change reports
          
          ### 4. Continuous Monitoring 📈
          - **Health Checks**: Repository metrics, dependency status
          - **Coverage Analysis**: Test coverage trends
          - **Quality Trends**: Code quality over time
          - **Output**: Weekly summaries and GitHub issues
          
          ### 5. Bottleneck Detection 🔍
          - **Code Complexity**: Identifies functions needing refactoring
          - **Maintainability**: Tracks maintainability index
          - **Performance**: Identifies optimization opportunities
          - **Output**: Prioritized recommendations
          
          ## 🚀 Quick Actions
          
          ### Run Manual Checks
          - [Trigger Performance Monitoring](https://github.com/${{ github.repository }}/actions/workflows/performance-monitoring.yml)
          - [Trigger Issue Detection](https://github.com/${{ github.repository }}/actions/workflows/automated-issue-detection.yml)
          - [Trigger Bottleneck Detection](https://github.com/${{ github.repository }}/actions/workflows/bottleneck-detection.yml)
          - [Create Auto-fix PR](https://github.com/${{ github.repository }}/actions/workflows/auto-optimization.yml) (Set create_pr=true)
          
          ### View Results
          - [Security Alerts](https://github.com/${{ github.repository }}/security/code-scanning)
          - [Workflow Runs](https://github.com/${{ github.repository }}/actions)
          - [Automated Issues](https://github.com/${{ github.repository }}/issues?q=label%3Aautomated)
          
          ## 📖 Documentation
          
          For detailed information, see [AUTOMATION.md](AUTOMATION.md)
          
          ## 📅 Next Scheduled Runs
          
          - **Daily 2 AM UTC**: Performance Monitoring
          - **Daily 3 AM UTC**: Issue Detection
          - **Daily 6 AM UTC**: Monitoring Agent
          - **Sunday 4 AM UTC**: Bottleneck Detection, CodeQL
          - **Monday 5 AM UTC**: Auto-Optimization
          
          ## 🎯 Current Focus Areas
          
          Based on automated analysis:
          1. Maintain code quality through continuous linting
          2. Monitor performance metrics daily
          3. Address security vulnerabilities promptly
          4. Reduce code complexity in identified hotspots
          5. Improve test coverage in under-tested areas
          
          ## 🔄 Workflow Integration
          
          All automation workflows integrate seamlessly with:
          - ✅ Existing Python checks (isort, Black, Flake8, Pyright)
          - ✅ Frontend CI (ESLint, Prettier, Playwright)
          - ✅ Docker build and release pipelines
          - ✅ Benchmark and testing infrastructure
          - ✅ Pre-commit hooks
          
          ---
          
          **Last Updated**: $(date)
          
          **Automation Status**: 🟢 All systems operational
          EOF
          
          cat automation-dashboard.md

      - name: Create dashboard issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dashboard = fs.readFileSync('automation-dashboard.md', 'utf8');
            
            // Check if there's an existing dashboard issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'automation-dashboard',
              state: 'open'
            });
            
            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: dashboard
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🤖 Automation Dashboard - Monthly Report',
                body: dashboard,
                labels: ['automation-dashboard', 'automated', 'documentation']
              });
            }

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: automation-dashboard
          path: automation-dashboard.md
          retention-days: 90
